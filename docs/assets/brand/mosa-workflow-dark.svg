<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="380" viewBox="0 0 1040 380" role="img" aria-labelledby="title desc">
<title id="title">Models within the MOSA library</title>
<desc id="desc">Two omic matrices and sample metadata are read through a common MuData interface. The MOSA VAE and other methods occupy the same model interface and return latent representations and reconstructions. The library handles configuration validation, model training, model cross-validation, hyperparameter optimization, saving model outputs, and analysis plotting.</desc>
