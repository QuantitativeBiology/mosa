data:
  path: outputs/tutorial/data.h5mu
  views: [gexp, meth]
  use_mutations: false
model:
  type: mosa_vae
  output_dir: outputs/tutorial/run
  random_seed: 42
  accelerator: cpu
  devices: 1
  num_epochs: 2
  batch_size: 16
  joint_latent_dim: 4
  views:
    gexp:
      hidden_layer_dims: [16]
    meth:
      hidden_layer_dims: [16]
evaluation:
  test_size: 0.2
  n_folds: 3
  strategy: stratified
  shuffle: true
