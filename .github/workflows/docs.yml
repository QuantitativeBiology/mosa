name: Docs

on:
  push:
    branches: ["**"]
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Build and check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements-docs.txt
      - name: Install documentation tools
        run: python -m pip install -r docs/requirements-docs.txt
      - name: Build site and check internal links
        run: mkdocs build --strict -f docs/mkdocs.yml
      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          # The built site validates its own links, including before its first deployment.
          args: >-
            --no-progress
            --exclude '^https://quantitativebiology.github.io/mosa(/.*)?$'
            'docs/**/*.md' 'README.md' 'CONTRIBUTING.md'
          fail: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Publish documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
