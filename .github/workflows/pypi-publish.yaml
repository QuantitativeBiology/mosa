name: Publish Python Package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check release guards
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python .github/scripts/release_checks.py --tag "$RELEASE_TAG"
          if [ -n "$RELEASE_TAG" ]; then
            git merge-base --is-ancestor HEAD origin/main || {
              echo '::error::Release commit must belong to main.'
              exit 1
            }
          fi

  test:
    name: Release CI
    needs: validate
    uses: ./.github/workflows/python.yml
    with:
      skip_behavioral: true

  build:
    name: Build and validate distributions
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build and check package metadata
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python .github/scripts/release_checks.py --tag "$RELEASE_TAG" --dist dist
      - name: Install built wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel-test"
          PYTHON="$RUNNER_TEMP/wheel-test/bin/python"
          TORCH=$(python -c 'import tomllib; print(next(r for r in tomllib.load(open("pyproject.toml","rb"))["project"]["dependencies"] if r.startswith("torch==")))')
          "$PYTHON" -m pip install "$TORCH" --index-url https://download.pytorch.org/whl/cpu
          "$PYTHON" -m pip install dist/*.whl
          "$PYTHON" -m pip check
          # Leave the checkout so imports cannot accidentally use source files.
          cd "$RUNNER_TEMP"
          "$PYTHON" -I -c 'import mosa; from importlib.metadata import version; assert mosa.__version__ == version("mosalib")'
          "$RUNNER_TEMP/wheel-test/bin/mosa" --help
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated distributions to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-distributions
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
