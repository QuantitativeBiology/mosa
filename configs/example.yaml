# MOSA example configuration
# Copy this file, adjust the data_path, and add or remove views to match your dataset.
#
# To convert existing CSVs to MuData format:
#   mosa convert --samplesheet data/samplesheet.csv \
#                --view transcriptomics:data/transcriptomics.csv \
#                --view methylation:data/methylation.csv \
#                --output data/dataset.h5mu

# ──────────────────────────────────────────────────────────────────
# DATA (MuData format)
# ──────────────────────────────────────────────────────────────────

# Path to MuData file (.h5mu or .zarr format)
data_path: data/dataset.h5mu

# Layer name containing per-feature masks (required)
mask_layer_name: mask

# Each entry under `views` defines one omic modality.
# The view name must match a modality name in the MuData file (.mod keys)
#
#   input_dim         – set automatically after loading; leave 0
#   output_dim        – reconstruction target dim; 0 mirrors input_dim
#   hidden_layer_dims – encoder/decoder layer sizes; the last value is the
#                       per-view latent dim before the joint bottleneck
#   loss_type         – "mean" (MSE averaged over present features) or
#                       "macro" (class-balanced MSE weighted by model_type)
#   dropout_p         – feature dropout rate inside encoder/decoder layers
#   discrete          – true for count/integer data (reserved for future NB loss)

views:
  transcriptomics:
    input_dim: 0
    output_dim: 0
    hidden_layer_dims: [512, 256]
    loss_type: mean
    dropout_p: 0.1
    discrete: false

  # Add more views here, matching modality names in MuData file:
  # methylation:
  #   input_dim: 0
  #   output_dim: 0
  #   hidden_layer_dims: [512, 256]
  #   loss_type: mean
  #   dropout_p: 0.1
  #   discrete: false

# Conditional vectors are concatenated to encoder and decoder inputs.
# They are built automatically from .obs columns in the MuData file:
# - model_type column: always included (batch correction)
# - tissue column: always included if present
# - mutation_* columns: always included if present (columns prefixed "mutation_")
conditional_dim: 0                  # set automatically after loading; leave 0
use_tissue: false
use_mutations: false

# ──────────────────────────────────────────────────────────────────
# TRAINING
# ──────────────────────────────────────────────────────────────────

fusion_method: concat       # "concat" (concatenation) or "poe" (Product of Experts)
joint_latent_dim: 64        # dimensionality of the shared latent bottleneck
view_dropout_prob: 0.2      # probability of zeroing an entire view during training
shared_hidden_layer_dims: []  # intermediate dims for PoE shared head; ignored if fusion_method is "concat"; [] if direct shared head (no hidden layers)

# Loss weights — set a weight to 0.0 to disable that term
kl_weight: 0.01             # β scaling the KL divergence term
contrastive_weight: 0.0     # tissue-supervised contrastive loss on the latent mean
adv_weight: 0.0             # adversarial batch-correction loss; also enables the discriminator

learning_rate: 0.001
num_epochs: 200
batch_size: 64
weighted_random_sampler: false    # use WeightedRandomSampler to balance model_type in training; set to false to disable
test_size: 0.1              # fraction held out as validation set; set to 0 to use all data for training
random_seed: 42

n_folds: 5                  # reserved for future cross-validation support; not used in single-run mode
n_batches: 0                # set automatically from the model_type column; leave 0

# ──────────────────────────────────────────────────────────────────
# TRAINER  (PyTorch Lightning)
# ──────────────────────────────────────────────────────────────────

trainer:
  # Hardware — "auto" lets PyTorch Lightning pick the best available device
  accelerator: auto         # auto | cpu | gpu | mps
  devices: auto             # auto | integer number of devices (e.g. 1 for single GPU)
  precision: "32"           # "32" (full) | "16-mixed" (FP16) | "bf16-mixed" (BF16)

  # Optimisation
  gradient_clip_val: 0.0    # maximum gradient norm; 0 disables clipping
  accumulate_grad_batches: 1 # increase to simulate a larger effective batch size

  # Logging & checkpointing
  log_every_n_steps: 50     # how often (in steps) metrics are written to the log
  early_stopping_patience: 20  # stop after this many epochs with no val/loss improvement
  checkpoint_top_k: 3       # number of best checkpoints to keep on disk

  # DataLoader
  num_workers: 0            # parallel data-loading workers; 0 = main process only
                            # set to 4–8 for large datasets to avoid GPU starvation

# ──────────────────────────────────────────────────────────────────
# OUTPUT
# ──────────────────────────────────────────────────────────────────

# Root directory for all saved artefacts.
#
# Optional corrected inference (mvae_adv-style):
#   inference: true  -> run corrected inference by forcing all samples to one model_type
#   target_batch: ""  -> if empty, first model_type category is used
#                        otherwise set to one existing model_type value
#
# After training the following files are written:
#
#   <output_dir>/
#     mosa-<epoch>-<val_loss>.ckpt        – model checkpoints (top-k by val/loss)
#     train/
#       latent.csv                        – joint latent z for the training split
#       recon_<omic>.csv                  – reconstructed features for the training split
#     val/
#       latent.csv                        – joint latent z for the validation split
#       recon_<omic>.csv                  – reconstructed features for the validation split
#     full/
#       latent.csv                        – joint latent z for all samples (original conditionals)
#       recon_<omic>.csv                  – reconstructed features for all samples (original conditionals)
#     inference/                           – only when inference: true
#       latent.csv                        – corrected latent z for all samples
#       recon_<omic>.csv                  – corrected reconstructed features for all samples

output_dir: outputs
inference: false
target_batch: ""
