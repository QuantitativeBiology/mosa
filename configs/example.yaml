# MOSA example configuration
# Copy this file and adjust data_path and views to match your dataset.
#
# Docs:
#   Getting started    docs/getting-started.md
#   Configuration ref  docs/configuration.md
#   Data pipeline      docs/data-pipeline.md
#   Architecture       docs/architecture.md
#
# To convert CSVs to MuData:
#   mosa convert --samplesheet data/samplesheet.csv \
#                --view transcriptomics:data/transcriptomics.csv \
#                --output data/dataset.h5mu


# Data

data_path: data/dataset.h5mu
mask_layer_name: mask
scaler_sample_frac: 1.0   # fraction of training samples used to fit the StandardScaler.
                          # Only relevant for zarr: reduces memory/I/O when fitting on the
                          # full training. No effect for h5mu.

# View names must match modality keys in the MuData file.
# hidden_layer_dims: encoder/decoder MLP sizes; last value sets the per-view embedding dim.
# loss_type: "mean" for standard MSE, "macro" for model_type-balanced MSE.
# discrete: true skips z-score normalisation (for count/integer data).
views:
  transcriptomics:
    hidden_layer_dims: [512, 256]
    loss_type: mean
    dropout_p: 0.1
    discrete: false

  # methylation:
  #   hidden_layer_dims: [512, 256]
  #   loss_type: mean
  #   dropout_p: 0.1
  #   discrete: false

# Conditionals are built from .obs automatically: model_type (always),
# tissue (if use_tissue), mutation_* columns (if use_mutations).
use_tissue: false
use_mutations: false


# Model

fusion_method: concat   # concat or poe
joint_latent_dim: 64
view_dropout_prob: 0.2
shared_hidden_layer_dims: []  # PoE only; hidden dims before the shared projection head


# KL term
# Optional linear warmup from kl_weight to kl_weight_final over kl_warmup_epochs.

kl_weight: 0.01
use_kl_scheduler: false
kl_weight_final: 0.01
kl_warmup_epochs: 0


# Contrastive term

contrastive_weight: 0.0   # tissue-supervised cosine contrastive loss; 0 disables


# Adversarial term
# adv_weight > 0 enables the discriminator and uses adv_learning_rate.

adv_weight: 0.0
adv_learning_rate: 0.001


# Optimiser

learning_rate: 0.001
lr_scheduler: none      # none or step
lr_step_size: 100       # epochs between StepLR decay steps
lr_gamma: 0.5           # multiplicative decay factor


# Training loop

num_epochs: 200
batch_size: 64
test_size: 0.1          # validation fraction; 0 disables validation and early stopping
weighted_random_sampler: false
random_seed: 42
n_folds: 5              # reserved for future cross-validation; unused in single-run mode


# Trainer

trainer:
  accelerator: auto     # auto, cpu, gpu, mps
  devices: auto         # auto or integer
  precision: "32"       # 32, 16-mixed, bf16-mixed

  gradient_clip_val: 0.0
  accumulate_grad_batches: 1

  log_every_n_steps: 50
  early_stopping_patience: 20
  checkpoint_top_k: 3

  num_workers: 0        # set to 4-8 for large datasets


# Output

output_dir: outputs
inference: false        # if true, runs corrected inference by forcing all samples to target_batch
target_batch: ""        # model_type value for corrected inference; empty uses the first category
                        # e.g. "Organoid", "Cell Line", "Tumor"
